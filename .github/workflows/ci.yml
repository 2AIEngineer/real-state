name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema builds without warnings and matches the snapshot
        run: |
          uv run python manage.py spectacular --fail-on-warn --format openapi-json --file /tmp/openapi.json
          python -c "import json,sys; a=json.load(open('/tmp/openapi.json')); b=json.load(open('api-contracts/tests/openapi.json')); sys.exit(a != b)" \
            || (echo "Schema changed: regenerate api-contracts/tests/openapi.json" && exit 1)
      - name: Tests
        run: uv run pytest -p no:cacheprovider

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api-contracts/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
